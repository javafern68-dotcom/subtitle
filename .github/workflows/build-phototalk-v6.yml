name: Build PhotoTalk V6 Full Offline

on:
  push:
    branches:
      - phototalk-v6-offline-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Reassemble and verify PhotoTalk V6 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem phototalk_v6/chunks/source_*.b64 | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Expected 6 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          if ($b64.Length -ne 20900) { throw "Source Base64 length mismatch: $($b64.Length)" }
          $zip = Join-Path $env:TEMP 'ptv6_source.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Source ZIP SHA256: $hash"
          if ($hash -ne '7be68c08c75c3ac2a1857bc4358e7624ad833697d537a7a0fc93f98947981f70') { throw 'Source ZIP SHA256 mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath . -Force
          if (-not (Test-Path phototalk_v6/build_v6.py)) { throw 'Build source extraction failed' }

      - name: Install Inno Setup compiler on build machine
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build bundle and run Windows smoke tests
        shell: pwsh
        run: python phototalk_v6/build_v6.py

      - name: Verify final installer size
        shell: pwsh
        run: |
          $f = Get-Item dist/PhotoTalk_Real_V6_FULL_OFFLINE_Setup.exe
          Write-Host "Final installer size: $([math]::Round($f.Length / 1MB, 1)) MB"
          if ($f.Length -lt 188743680) { throw 'Installer is unexpectedly small' }

      - name: Publish single EXE to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'phototalk-v6-full-offline'
          $exe = 'dist/PhotoTalk_Real_V6_FULL_OFFLINE_Setup.exe'
          $sha = 'dist/PhotoTalk_Real_V6_FULL_OFFLINE_SHA256.txt'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $sha --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag $exe $sha --repo $env:GITHUB_REPOSITORY --title 'PhotoTalk Real V6 FULL OFFLINE' --notes 'Single self-contained Windows installer. No joining or extra runtime download required after download.'
          }

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoTalk-Real-V6-FULL-OFFLINE
          path: |
            dist/PhotoTalk_Real_V6_FULL_OFFLINE_Setup.exe
            dist/PhotoTalk_Real_V6_FULL_OFFLINE_SHA256.txt
          compression-level: 0
          retention-days: 7
