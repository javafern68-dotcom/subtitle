name: Build Windows Offline Installer

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

jobs:
  build-windows-offline-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python build_icon.py

      - name: Download and bundle FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive "ffmpeg.zip" -DestinationPath "ffmpeg-package"
          $ffmpegRoot = (Get-ChildItem "ffmpeg-package" -Directory | Select-Object -First 1).FullName
          $bin = Join-Path $ffmpegRoot "bin"
          New-Item -ItemType Directory -Force -Path "tools" | Out-Null
          Copy-Item "$bin\ffmpeg.exe" "tools\ffmpeg.exe"
          Copy-Item "$bin\ffprobe.exe" "tools\ffprobe.exe"
          Copy-Item "$bin\ffplay.exe" "tools\ffplay.exe"

      - name: Build offline Whisper engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git clone --depth 1 --branch "v1.9.3" https://github.com/ggml-org/whisper.cpp.git whisper-src
          cmake -S whisper-src -B whisper-build -A x64 `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_SERVER=OFF `
            -DWHISPER_BUILD_EXAMPLES=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_STATIC=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_OPENMP=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build whisper-build --config Release --target whisper-cli --parallel 2
          $cli = Get-ChildItem "whisper-build" -Recurse -Filter "whisper-cli.exe" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (!$cli) { throw "whisper-cli.exe was not built" }
          New-Item -ItemType Directory -Force -Path "tools\whisper" | Out-Null
          Copy-Item $cli.FullName "tools\whisper\whisper-cli.exe"
          Get-ChildItem $cli.Directory.FullName -Filter "*.dll" | Copy-Item -Destination "tools\whisper" -ErrorAction SilentlyContinue

      - name: Download verified Accurate Bangla AI and VAD models
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "models" | Out-Null
          $model = "models\ggml-bengali-medium-q4_0.bin"
          curl.exe -L --fail --retry 3 --retry-delay 5 `
            "https://huggingface.co/SayedShaun/bengali-whisper-medium-ggml/resolve/main/ggml-model-q4_0.bin?download=true" `
            -o $model
          $expectedHash = "6ccc65d58a7915f8d9a6d3d45ec2d6d10c784bd2c7b40a5a6b053712040b51d1"
          $actualHash = (Get-FileHash $model -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash) { throw "Offline model checksum mismatch: $actualHash" }
          $vadModel = "models\ggml-silero-v6.2.0.bin"
          curl.exe -L --fail --retry 3 --retry-delay 5 `
            "https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin?download=true" `
            -o $vadModel
          $expectedVadHash = "2aa269b785eeb53a82983a20501ddf7c1d9c48e33ab63a41391ac6c9f7fb6987"
          $actualVadHash = (Get-FileHash $vadModel -Algorithm SHA256).Hash.ToLower()
          if ($actualVadHash -ne $expectedVadHash) { throw "VAD model checksum mismatch: $actualVadHash" }

      - name: Build Offline 100-language Translation model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          ct2-transformers-converter `
            --model "facebook/m2m100_418M" `
            --output_dir "models\m2m100-418M-int8" `
            --quantization int8 `
            --copy_files sentencepiece.bpe.model tokenizer_config.json special_tokens_map.json vocab.json generation_config.json
          if (!(Test-Path "models\m2m100-418M-int8\model.bin")) { throw "Translation model conversion failed" }
          python -m pip uninstall -y torch

      - name: Run automated tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build standalone Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "Bangla Subtitle Studio" `
            --icon "app.ico" `
            --additional-hooks-dir "pyinstaller_hooks" `
            --collect-all avro `
            --collect-all ctranslate2 `
            --collect-all sentencepiece `
            --collect-data transformers `
            --copy-metadata transformers `
            --hidden-import "transformers.models.m2m_100" `
            --hidden-import "transformers.models.m2m_100.tokenization_m2m_100" `
            --add-binary "tools\ffmpeg.exe;tools" `
            --add-binary "tools\ffprobe.exe;tools" `
            --add-binary "tools\ffplay.exe;tools" `
            run_app.py

      - name: Bundle Offline engine and model
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = "dist\Bangla Subtitle Studio"
          New-Item -ItemType Directory -Force -Path "$app\tools\whisper" | Out-Null
          New-Item -ItemType Directory -Force -Path "$app\models" | Out-Null
          New-Item -ItemType Directory -Force -Path "$app\licenses" | Out-Null
          Copy-Item "tools\whisper\*" "$app\tools\whisper" -Recurse -Force
          Copy-Item "models\ggml-bengali-medium-q4_0.bin" "$app\models\ggml-bengali-medium-q4_0.bin"
          Copy-Item "models\ggml-silero-v6.2.0.bin" "$app\models\ggml-silero-v6.2.0.bin"
          Copy-Item "models\m2m100-418M-int8" "$app\models\m2m100-418M-int8" -Recurse -Force
          Copy-Item "THIRD_PARTY_NOTICES.txt" "$app\licenses\THIRD_PARTY_NOTICES.txt"
          Copy-Item "whisper-src\LICENSE" "$app\licenses\whisper.cpp-LICENSE.txt"

      - name: Verify bundled application with real Bengali speech
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = "dist\Bangla Subtitle Studio"
          if (!(Test-Path "$app\Bangla Subtitle Studio.exe")) { throw "Application EXE missing" }
          if (!(Test-Path "$app\_internal\tools\ffmpeg.exe") -and !(Test-Path "$app\tools\ffmpeg.exe")) { throw "FFmpeg missing" }
          if (!(Test-Path "$app\tools\whisper\whisper-cli.exe")) { throw "Offline Whisper engine missing" }
          if (!(Test-Path "$app\models\ggml-bengali-medium-q4_0.bin")) { throw "Accurate Offline model missing" }
          if (!(Test-Path "$app\models\ggml-silero-v6.2.0.bin")) { throw "Voice Activity Detection model missing" }
          if (!(Test-Path "$app\models\m2m100-418M-int8\model.bin")) { throw "Offline Translation model missing" }
          & "$app\tools\whisper\whisper-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Offline Whisper engine self-test failed" }
          $modelHash = (Get-FileHash "$app\models\ggml-bengali-medium-q4_0.bin" -Algorithm SHA256).Hash.ToLower()
          if ($modelHash -ne "6ccc65d58a7915f8d9a6d3d45ec2d6d10c784bd2c7b40a5a6b053712040b51d1") { throw "Bundled model verification failed" }
          $vadHash = (Get-FileHash "$app\models\ggml-silero-v6.2.0.bin" -Algorithm SHA256).Hash.ToLower()
          if ($vadHash -ne "2aa269b785eeb53a82983a20501ddf7c1d9c48e33ab63a41391ac6c9f7fb6987") { throw "Bundled VAD model verification failed" }
          curl.exe -L --fail --retry 3 --retry-delay 5 `
            "https://huggingface.co/bangla-speech-processing/BanglaASR/resolve/main/mp3/common_voice_bn_31515636.mp3?download=true" `
            -o "bangla-smoke.mp3"
          & "$app\_internal\tools\ffmpeg.exe" -y -hide_banner -loglevel error -i "bangla-smoke.mp3" -ar 16000 -ac 1 -c:a pcm_s16le "bangla-smoke.wav"
          & "$app\tools\whisper\whisper-cli.exe" -m "$app\models\ggml-bengali-medium-q4_0.bin" -f "bangla-smoke.wav" -l bn -otxt -osrt -of "bangla-smoke" -ml 42 -sow -np --vad -vm "$app\models\ggml-silero-v6.2.0.bin" -vt 0.45 -vspd 120 -vsd 250 -vmsd 28 -vp 120 -vo 0.20
          if ($LASTEXITCODE -ne 0) { throw "Offline Bengali transcription smoke test failed" }
          $banglaText = Get-Content "bangla-smoke.txt" -Raw -Encoding UTF8
          if ($banglaText -notmatch '[\u0980-\u09FF]') { throw "The bundled model did not create Bengali-script text: $banglaText" }
          Write-Host "Verified Bengali-script output: $banglaText"
          $srtTest = Start-Process "$app\Bangla Subtitle Studio.exe" -ArgumentList @("--srt-self-test", "bangla-smoke.srt") -Wait -PassThru
          if ($srtTest.ExitCode -ne 0) { throw "Packaged Bengali SRT reader self-test failed" }
          Write-Host "Verified actual Bengali SRT in packaged application"
          $translationTest = Start-Process "$app\Bangla Subtitle Studio.exe" -ArgumentList "--translation-self-test" -Wait -PassThru
          if ($translationTest.ExitCode -ne 0) { throw "Packaged Bengali-to-Hindi Translation self-test failed" }
          Write-Host "Verified packaged Bengali-to-Hindi Offline Translation"
          Get-ChildItem $app -Recurse | Measure-Object -Property Length -Sum

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup EXE
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "BanglaSubtitleStudio.iss"
          if (!(Test-Path "installer\Bangla_Subtitle_Studio_Accurate_Multilanguage_Setup_V2.5.exe")) { throw "Setup EXE missing" }

      - name: Create checksum
        shell: pwsh
        run: |
          (Get-FileHash "installer\Bangla_Subtitle_Studio_Accurate_Multilanguage_Setup_V2.5.exe" -Algorithm SHA256).Hash.ToLower() | Out-File "installer\Bangla_Subtitle_Studio_Accurate_Multilanguage_Setup_V2.5.sha256.txt" -Encoding ascii

      - name: Publish Offline installer in GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v2.5.0"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              "installer\Bangla_Subtitle_Studio_Accurate_Multilanguage_Setup_V2.5.exe" `
              "installer\Bangla_Subtitle_Studio_Accurate_Multilanguage_Setup_V2.5.sha256.txt" `
              --target "${{ github.sha }}" `
              --title "Bangla Subtitle Studio V2.5 Accurate Multilanguage" `
              --notes "Restores the proven V2.2 Bengali Medium Q4 recognition model for faithful speech-to-text, adds Silero Voice Activity Detection so speech is detected from the correct position, creates shorter native timed lines instead of estimating long-segment timing, and checks two translation candidates by translating them back to Bengali before choosing the closest meaning. Bengali Unicode, Avro/Banglish, Hindi, English, Arabic, Urdu and all previous languages remain. No API key, Internet, subscription, or per-video cost. Installs over earlier versions without uninstalling."
          }
          else {
            gh release upload $tag `
              "installer\Bangla_Subtitle_Studio_Accurate_Multilanguage_Setup_V2.5.exe" `
              "installer\Bangla_Subtitle_Studio_Accurate_Multilanguage_Setup_V2.5.sha256.txt" `
              --clobber
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bangla-Subtitle-Studio-Accurate-Multilanguage-Setup-V2.5
          path: |
            installer/Bangla_Subtitle_Studio_Accurate_Multilanguage_Setup_V2.5.exe
            installer/Bangla_Subtitle_Studio_Accurate_Multilanguage_Setup_V2.5.sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
